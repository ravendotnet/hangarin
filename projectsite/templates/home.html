{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="content">
    <div class="container-fluid">
    <h4 class="page-title">Home</h4>

    <!-- STAT CARDS -->
    <div class="row">
        
        <!-- Students -->
        <div class="col-md-3">
            <div class="card card-stats card-warning">
                <div class="card-body">
                    <div class="row">
                        <div class="col-5">
                            <div class="icon-big text-center">
                                <i class="la la-users"></i>
                            </div>
                        </div>

                        <div class="col-7 d-flex align-items-center">
                            <div class="numbers">
                                <p class="card-category">Task</p>
                                <h4 class="card-title">{{ total_task }}</h4>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Joined This Year -->
        <div class="col-md-3">
            <div class="card card-stats card-success">
                <div class="card-body">
                    <div class="row">
                        <div class="col-5">
                            <div class="icon-big text-center">
                                <i class="la la-bar-chart"></i>
                            </div>
                        </div>

                        <div class="col-7 d-flex align-items-center">
                            <div class="numbers">
                                <p class="card-category">Due Today</p>
                                <h4 class="card-title">{{ task_deadline }}</h4>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Org -->
        <div class="col-md-3">
            <div class="card card-stats card-danger">
                <div class="card-body">
                    <div class="row">
                        <div class="col-5">
                            <div class="icon-big text-center">
                                <i class="la la-newspaper-o"></i>
                            </div>
                        </div>

                        <div class="col-7 d-flex align-items-center">
                            <div class="numbers">
                                <p class="card-category">Organizations</p>
                                <!--<h4 class="card-title">{{ total_org }}</h4>-->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Program -->
        <div class="col-md-3">
            <div class="card card-stats card-primary">
                <div class="card-body">
                    <div class="row">
                        <div class="col-5">
                            <div class="icon-big text-center">
                                <i class="la la-check-circle"></i>
                            </div>
                        </div>

                        <div class="col-7 d-flex align-items-center">
                            <div class="numbers">
                                <p class="card-category">Programs</p>
                                <!--<h4 class="card-title">{{ total_program }}</h4>-->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- PAGE CONTENT -->
    <div class="row">
        <div class="col-md-12">
            <div class="card">
                <div class="card-header">
                    <div class="card-title">Page Title</div>
                    <div class="card-category">Page Subtitle</div>
                </div>

                <div class="card-body">
                    Hello, World
                </div>
            </div>
        </div>
    </div>

</div>
</div>

{% endblock %}
